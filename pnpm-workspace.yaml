packages:
  - apps/*
  - packages/*
# Paket yang boleh menjalankan build script saat install (pnpm 12 menolak sisanya).
# esbuild dipakai tsx dan vitest. Postinstall @firebase/util (default auto-init web SDK) dan
# protobufjs (cek versi CLI) tidak dibutuhkan firebase-admin, jadi ditolak.
allowBuilds:
  '@firebase/util': false
  esbuild: true
  protobufjs: false
