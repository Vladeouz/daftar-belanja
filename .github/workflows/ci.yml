# CI (FR-14): menjalankan `pnpm check` (langkah yang sama dengan verifikasi lokal) dengan service
# PostgreSQL dan image emulator Firebase dari docker/firebase-emulator/Dockerfile.
# Env tidak perlu di-set: default di apps/api/test/setup/env.ts sudah menunjuk layanan di bawah.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      # Nilai sama dengan default docker-compose.yml dan .env.example.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: template
          POSTGRES_PASSWORD: template
          POSTGRES_DB: template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U template -d template"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Image emulator di-build dengan cache layer GitHub Actions (build pertama beberapa menit),
      # lalu dijalankan lewat docker-compose.yml agar konfigurasi sama dengan lokal.
      - uses: docker/setup-buildx-action@v4
      - name: Build image emulator Firebase
        uses: docker/build-push-action@v7
        with:
          context: docker/firebase-emulator
          tags: profil-a/firebase-emulator:local
          load: true
          cache-from: type=gha,scope=firebase-emulator
          cache-to: type=gha,mode=max,scope=firebase-emulator
      - name: Jalankan Auth dan Storage Emulator
        run: docker compose up -d --wait --no-build firebase-auth firebase-storage

      # Versi pnpm dibaca dari `packageManager` di package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Versi sama dengan README dan docs/conventions.md.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: pnpm check

      - name: Simpan output langkah yang gagal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: .check-logs/
          # `.check-logs` diawali titik; tanpa ini upload-artifact melewatinya.
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Log emulator
        if: failure()
        run: docker compose logs firebase-auth firebase-storage
